<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1022">
<title>Rooftop Spades</title>
<meta name="description" content="Rooftop Spades: partnership Spades in first person on a city rooftop at night. Play with friends as your own HopLobby avatar; bots fill the empty seats.">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<canvas id="view" aria-label="The card table"></canvas>

<!-- Inside HopLobby its own loading screen covers this (HopLobby.progress drives it). -->
<div id="loading" class="loading">
  <div class="logo"><span class="sp">&#9824;</span> ROOFTOP <b>SPADES</b></div>
  <div class="load-bar"><span id="loadFill"></span></div>
  <div class="load-msg" id="loadMsg">&hellip;</div>
</div>

<div id="menu" class="menu" hidden>
  <div class="menu-card">
    <div class="logo"><span class="sp">&#9824;</span> ROOFTOP <b>SPADES</b></div>
    <div class="maker"><img src="assets/ctsg-seal.png" alt="">a CTSG game</div>
    <p class="tag" data-t="tag"></p>
    <div class="opts" id="opts">
      <div class="opt"><span class="opt-l" data-t="timer"></span><div class="seg" id="optTimer"><button type="button" data-v="0" data-t="off"></button><button type="button" data-v="20">20 s</button><button type="button" data-v="30">30 s</button><button type="button" data-v="60">60 s</button></div></div>
      <div class="opt"><span class="opt-l" data-t="gameTo"></span><div class="seg" id="optTarget"><button type="button" data-v="500">500</button><button type="button" data-v="300">300</button></div></div>
      <div class="opt"><span class="opt-l" data-t="blindNil"></span><div class="seg" id="optBlind"><button type="button" data-v="1" data-t="on"></button><button type="button" data-v="0" data-t="off"></button></div></div>
      <div class="opt" title=""><span class="opt-l"><span data-t="chaos"></span><small data-t="chaosHelp"></small></span><div class="seg" id="optChaos"><button type="button" data-v="0" data-t="off"></button><button type="button" data-v="1" data-t="on"></button></div></div>
    </div>
    <p class="menu-note" id="menuNote"></p>
    <div class="menu-btns">
      <button type="button" id="btnPlay" class="play" data-t="walkIn"></button>
      <button type="button" id="btnTut" class="ghost" data-t="howTo"></button>
      <button type="button" id="btnRules" class="ghost" data-t="rules"></button>
    </div>
    <div class="keys keys-desk" data-t="walkKeysDesk"></div>
    <div class="keys keys-touch" data-t="walkKeysTouch"></div>
  </div>
</div>

<!-- Walking the rooftop: the sit-down prompt, messages, the phone's stick. -->
<div id="walkHud" class="walk-hud" hidden>
  <div id="prompt" class="prompt" hidden><div id="promptTxt" class="prompt-txt"></div><button type="button" id="btnSit" class="sit"></button></div>
  <div id="walkMsg" class="walk-msg" hidden></div>
  <div class="walk-keys keys-desk" data-t="walkKeysDesk"></div>
  <div class="walk-keys keys-touch" data-t="walkKeysTouch"></div>
  <div class="corner">
    <button type="button" id="wMenu" class="round" title="Options">&#9776;</button>
    <button type="button" id="wHelp" class="round" title="Rules (H)">?</button>
    <button type="button" id="wSettings" class="round" title="Settings (P)">&#9881;</button>
  </div>
  <div id="stick" class="stick" hidden><span id="stickKnob"></span></div>
</div>

<div id="hud" class="hud" hidden>
  <div id="scores" class="scores"></div>
  <div id="myBid" class="my-bid" hidden></div>
  <div id="status" class="status"><svg class="ring" viewBox="0 0 36 36" id="ring"><circle cx="18" cy="18" r="15.5" class="ring-bg"></circle><circle cx="18" cy="18" r="15.5" class="ring-fg" id="ringFg"></circle><text x="18" y="22.5" id="ringTxt"></text></svg><span id="statusTxt"></span></div>
  <div id="chat" class="chat" aria-live="polite"></div>
  <div id="tags" class="tags"></div>
  <div id="bidPanel" class="bid-panel" hidden>
    <div class="bid-title" data-t="bidTitle"></div>
    <div class="bid-sub" id="bidSub"></div>
    <div class="bid-grid" id="bidGrid"></div>
    <div class="bid-blind" id="bidBlind" hidden>
      <p data-t="bidBlindHelp"></p>
      <button type="button" id="btnBlind" class="chip blind" data-t="bidBlind"></button>
      <button type="button" id="btnLook" class="ghost" data-t="bidLook"></button>
    </div>
  </div>
  <button type="button" id="btnPlayCard" class="play-card" hidden></button>
  <div id="hand" class="hand" aria-label="Your hand"></div>
  <div id="zoom" class="zoom" hidden><canvas id="zoomCard" width="200" height="280"></canvas><div id="zoomCap" class="zoom-cap"></div></div>
  <div class="corner">
    <button type="button" id="btnStand" class="round stand" title="Stand up (Q)" data-t="standShort"></button>
    <button type="button" id="btnZoom" class="round" title="Zoom in on the last card played (Z)">&#128269;</button>
    <button type="button" id="btnReact" class="round" title="Reactions (R)">&#9786;</button>
    <button type="button" id="btnHelp" class="round" title="Rules (H)">?</button>
    <button type="button" id="btnSettings" class="round" title="Settings (P)">&#9881;</button>
  </div>
  <div id="wheel" class="wheel" hidden></div>
  <div id="lookPad" class="look-pad">
    <button type="button" data-q="left" title="Look left (2)">&#8678;</button>
    <button type="button" data-q="partner" title="Look at your partner (1)">&#8679;</button>
    <button type="button" data-q="hand" title="Back to your hand (Space)">&#9675;</button>
    <button type="button" data-q="right" title="Look right (3)">&#8680;</button>
  </div>
  <div id="coach" class="coach" hidden><div class="coach-step" id="coachStep"></div><div id="coachText"></div><div class="coach-btns"><button type="button" id="coachNext" data-t="next"></button><button type="button" id="coachSkip" class="ghost" data-t="skip"></button></div></div>
</div>

<div id="summary" class="overlay soft" hidden><div class="panel" id="sumBody"></div></div>
<div id="final" class="overlay" hidden><div class="panel wide" id="finalBody"></div></div>
<div id="scoreSheet" class="overlay soft" hidden><div class="panel" id="sheetBody"></div></div>

<div id="settings" class="overlay" hidden>
  <div class="panel">
    <h2 data-t="settings"></h2>
    <!-- Inside HopLobby: its own settings (Esc menu) rule sound, graphics and the camera; shown here, changed there. -->
    <div id="hlSet" class="hl-set" hidden>
      <h3 data-t="hlTitle"></h3>
      <div class="row"><span data-t="hlVolume"></span><b id="hlVol"></b></div>
      <div class="row"><span data-t="graphics"></span><b id="hlGfx"></b></div>
      <div class="row"><span data-t="sens"></span><b id="hlSens"></b></div>
      <div class="row"><span data-t="hlInvert"></span><b id="hlInv"></b></div>
      <div class="row"><span data-t="hlFov"></span><b id="hlFov"></b></div>
      <p class="hl-note" data-t="hlNote"></p>
      <h3 data-t="hlGame"></h3>
    </div>
    <div class="row own-only"><span data-t="music"></span><input type="range" id="sMusic" min="0" max="1" step="0.05"></div>
    <div class="row own-only"><span data-t="sound"></span><button type="button" id="sSound"></button></div>
    <div class="row"><span data-t="reactAuto"></span><button type="button" id="sReact"></button></div>
    <div class="row"><span data-t="assist"></span><button type="button" id="sAssist"></button></div>
    <div class="row"><span data-t="zoomAuto"></span><button type="button" id="sZoom"></button></div>
    <div class="row"><span data-t="tags"></span><button type="button" id="sTags"></button></div>
    <div class="row own-only"><span data-t="graphics"></span><button type="button" id="sQuality"></button></div>
    <div class="row own-only"><span data-t="sens"></span><input type="range" id="sSens" min="0.3" max="2.5" step="0.1"></div>
    <button type="button" id="sClose" class="big" data-t="resume"></button>
  </div>
</div>
<div id="rulesBox" class="overlay" hidden><div class="panel wide rules"><h2 data-t="rules"></h2><div id="rulesBody"></div><button type="button" id="rulesClose" class="big" data-t="close"></button></div></div>

<div id="rotate" class="rotate" hidden><div data-t="rotate"></div><button type="button" id="rotateOk" data-t="rotateOk"></button></div>
<div id="err" class="err" hidden></div>

<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = "Error: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")";
  });
</script>
<script>
/* The game's scripts, in order. They download in parallel and each one is
   retried if the network drops it; then they run in this order (from Bladed).
   hoplobby.js is an unchanged copy of HopLobby SDK v1 (1.3.0). */
(function () {
  var FILES = ["hoplobby.js", "vendor/three.min.js", "vendor/GLTFLoader.js", "src/util.js?v=3", "src/strings.js?v=3", "src/rules.js?v=3", "src/bot.js?v=3",
    "src/table.js?v=3", "src/net.js?v=3", "src/build.js?v=3", "src/room.js?v=5", "src/view.js?v=4", "src/cards.js?v=4", "src/seats.js?v=3", "src/walkers.js?v=3", "src/crews.js?v=3",
    "src/audio.js?v=3", "src/hud.js?v=5", "src/tutorial.js?v=3", "src/main.js?v=5"];
  function fail(src) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = "Couldn't download " + src.split("?")[0] + ". Check your connection and reload.";
  }
  if (location.protocol === "file:") {
    FILES.forEach(function (src) { document.write('<script src="' + src + '"><\/script>'); });
    return;
  }
  function get(src, attempt) {
    var url = attempt ? src + (src.indexOf("?") < 0 ? "?" : "&") + "retry=" + attempt : src;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).catch(function () {
      if (attempt >= 4) { fail(src); throw new Error("gave up on " + src); }
      return new Promise(function (ok) { setTimeout(ok, 400 * (attempt + 1)); }).then(function () { return get(src, attempt + 1); });
    });
  }
  Promise.all(FILES.map(function (src) { return get(src, 0); })).then(function (texts) {
    texts.forEach(function (text, i) {
      var s = document.createElement("script");
      s.textContent = text + "\n//# sourceURL=" + new URL(FILES[i], location.href).href;
      document.body.appendChild(s);
    });
  }, function () { /* fail() already said which file */ });
})();
</script>
</body>
</html>
